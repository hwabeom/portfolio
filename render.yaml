# Render Blueprint — 대시보드에서 New + → Blueprint 로 이 저장소를 연결하면 그대로 배포된다
#
# 무료 플랜 제약
# - 영구 디스크를 붙일 수 없어, 서버가 잠들었다 깨거나 재배포하면 DB가 기본 글 상태로 돌아간다
# - SMTP 포트(465·587)가 막혀 메일 알림을 보낼 수 없다 (메시지는 관리자 화면의 '받은 메시지'에서 확인)
# 유료로 바꾸려면 plan 을 starter 로 바꾸고 아래 주석의 disk·SMTP 설정을 살린다 (요금이 청구된다)
services:
  - type: web
    name: hwabeom-portfolio
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    # disk:
    #   name: portfolio-data
    #   mountPath: /data
    #   sizeGB: 1
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # - key: SMTP_HOST
      #   value: smtp.gmail.com
      # - key: SMTP_PORT
      #   value: "465"
      # - key: SMTP_USER
      #   sync: false
      # - key: SMTP_PASS
      #   sync: false
      # - key: MAIL_TO
      #   value: yeda0311@gmail.com
